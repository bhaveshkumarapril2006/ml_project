<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Student Score Predictor</title>
	<style>
		:root {
			--ink: #17212b;
			--muted: #607080;
			--paper: #f6f4ef;
			--card: #ffffff;
			--accent: #d65a3a;
			--accent-dark: #a83d27;
			--line: #d9dedb;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			color: var(--ink);
			background: radial-gradient(circle at top right, #f5c9a8 0, transparent 34%), var(--paper);
			font-family: Georgia, "Times New Roman", serif;
		}

		main {
			width: min(960px, calc(100% - 32px));
			margin: 0 auto;
			padding: 64px 0;
		}

		.intro { max-width: 620px; margin-bottom: 32px; }
		.eyebrow {
			margin: 0 0 12px;
			color: var(--accent-dark);
			font: 700 0.78rem/1.2 Arial, sans-serif;
			letter-spacing: 0.12em;
			text-transform: uppercase;
		}
		h1 { margin: 0; font-size: clamp(2.5rem, 7vw, 5rem); line-height: 0.95; }
		.intro p { color: var(--muted); font: 1.08rem/1.6 Arial, sans-serif; }

		form {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 22px;
			padding: 30px;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: var(--card);
			box-shadow: 0 18px 45px rgba(23, 33, 43, 0.08);
		}

		.field { display: flex; flex-direction: column; gap: 8px; }
		label { font: 700 0.9rem Arial, sans-serif; }
		select, input {
			width: 100%;
			min-height: 46px;
			padding: 0 12px;
			border: 1px solid var(--line);
			border-radius: 4px;
			color: var(--ink);
			background: #fbfcfb;
			font: 1rem Arial, sans-serif;
		}
		select:focus, input:focus { outline: 3px solid rgba(214, 90, 58, 0.2); border-color: var(--accent); }
		.submit { grid-column: 1 / -1; margin-top: 8px; }
		button {
			width: 100%;
			min-height: 52px;
			border: 0;
			border-radius: 4px;
			color: #fff;
			background: var(--accent);
			cursor: pointer;
			font: 700 1rem Arial, sans-serif;
		}
		button:hover { background: var(--accent-dark); }

		@media (max-width: 640px) {
			main { padding: 40px 0; }
			form { grid-template-columns: 1fr; padding: 20px; }
			.submit { grid-column: auto; }
		}
	</style>
</head>
<body>
	<main>
		<section class="intro">
			<p class="eyebrow">Academic analytics</p>
			<h1>Predict a student's math score.</h1>
			<p>Enter the student's background and reading and writing scores to generate a prediction.</p>
		</section>

		<form action="{{ url_for('predict') }}" method="post">
			<div class="field">
				<label for="gender">Gender</label>
				<select id="gender" name="gender" required>
					<option value="">Select gender</option>
					<option value="female">Female</option>
					<option value="male">Male</option>
				</select>
			</div>

			<div class="field">
				<label for="race_ethnicity">Race or ethnicity</label>
				<select id="race_ethnicity" name="race_ethnicity" required>
					<option value="">Select group</option>
					<option value="group A">Group A</option>
					<option value="group B">Group B</option>
					<option value="group C">Group C</option>
					<option value="group D">Group D</option>
					<option value="group E">Group E</option>
				</select>
			</div>

			<div class="field">
				<label for="parental_level_of_education">Parental education</label>
				<select id="parental_level_of_education" name="parental_level_of_education" required>
					<option value="">Select education level</option>
					<option value="some high school">Some high school</option>
					<option value="high school">High school</option>
					<option value="some college">Some college</option>
					<option value="associate's degree">Associate's degree</option>
					<option value="bachelor's degree">Bachelor's degree</option>
					<option value="master's degree">Master's degree</option>
				</select>
			</div>

			<div class="field">
				<label for="lunch">Lunch</label>
				<select id="lunch" name="lunch" required>
					<option value="">Select lunch type</option>
					<option value="standard">Standard</option>
					<option value="free/reduced">Free or reduced</option>
				</select>
			</div>

			<div class="field">
				<label for="test_preparation_course">Test preparation</label>
				<select id="test_preparation_course" name="test_preparation_course" required>
					<option value="">Select preparation status</option>
					<option value="none">None</option>
					<option value="completed">Completed</option>
				</select>
			</div>

			<div class="field">
				<label for="writing_score">Writing score</label>
				<input id="writing_score" name="writing_score" type="number" min="0" max="100" required>
			</div>

			<div class="field">
				<label for="reading_score">Reading score</label>
				<input id="reading_score" name="reading_score" type="number" min="0" max="100" required>
			</div>

			<div class="submit">
				<button type="submit">Generate prediction</button>
			</div>
		</form>
	</main>
</body>
</html>
